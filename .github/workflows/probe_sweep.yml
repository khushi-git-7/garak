name: probe sweep (fork only)

on:
  push:
    branches: ['ci/probe-sweep']
  workflow_dispatch:

permissions:
  contents: read

env:
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache
  XDG_DATA_HOME: ${{ github.workspace }}/.data
  XDG_CONFIG_HOME: ${{ github.workspace }}/.config

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        target: [test.Nones]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet || true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -e .
      - name: Run every probe module
        run: |
          set +e; mkdir -p out
          for f in garak/probes/*.py; do
            m=$(basename "$f" .py)
            case "$m" in __init__|base|_tier) continue;; esac
            echo "::group::$m"
            timeout 1500 python -m garak -t ${{ matrix.target }} -p "$m" -g 1 \
              --report_prefix "${m}" > "out/${m}.txt" 2>&1
            echo "$m exit=$?" | tee -a out/exits.txt
            tail -5 "out/${m}.txt"
            echo "::endgroup::"
          done
      - name: Summarise
        if: always()
        run: |
          cat out/exits.txt || true
          grep -l "Traceback" out/*.txt || true
          grep -c "Traceback\|ERROR" .data/garak/garak.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.target }}
          path: |
            out
            .data/garak/garak.log
            .data/garak/garak_runs
