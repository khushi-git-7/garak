name: verify hfdetector none outputs (fork only)
on:
  push:
    branches: ['verify/hfdetector-none']
permissions:
  contents: read
env:
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: Without the fix (expect the new test to fail)
        shell: bash
        run: |
          git show HEAD~1:garak/detectors/base.py > /tmp/base_fixed.py
          git show HEAD~2:garak/detectors/base.py > garak/detectors/base.py
          python -m pytest tests/detectors/test_detectors_unsafe_content.py -k none_outputs -q -p no:cacheprovider 2>&1 | tail -15 || true
          cp /tmp/base_fixed.py garak/detectors/base.py
          git diff --stat
      - name: With the fix
        shell: bash
        run: python -m pytest tests/detectors/test_detectors_unsafe_content.py tests/detectors/test_detectors_base.py tests/detectors/test_detectors_misleading.py tests/detectors/test_detectors_mitigation.py tests/detectors/test_detectors.py -q
