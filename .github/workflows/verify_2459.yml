name: verify 2459 toxicity tests (fork only)
on:
  push:
    branches: ['verify/2459-tox']
permissions:
  contents: read
env:
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: Sweep tests/detectors for outputs dropped by language (main's tests and this branch's)
        shell: bash
        run: |
          python -m pytest tests/detectors -q -p no:cacheprovider -p sweep_plugin -x --co -q > /dev/null
          python -m pytest tests/detectors -q -p no:cacheprovider -p sweep_plugin 2>&1 | tail -3 || true
          echo "### tests where outputs were dropped (with this branch's fix):"
          sort sweep.log | uniq -c | sort -rn | head -60 || echo none
