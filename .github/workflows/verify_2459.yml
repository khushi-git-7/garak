name: verify 2459 toxicity tests (fork only)
on:
  push:
    branches: ['verify/2459-tox']
permissions:
  contents: read
env:
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: Sweep tests/detectors for outputs dropped by language (main's tests and this branch's)
        shell: bash
        run: |
          git fetch -q --depth=1 origin main
          git show FETCH_HEAD:tests/detectors/test_detectors_unsafe_content.py > /tmp/fixed.py
          cp tests/detectors/test_detectors_unsafe_content.py /tmp/fixed.py
          git checkout FETCH_HEAD -- tests/detectors/test_detectors_unsafe_content.py
          python -m pytest tests/detectors -q -p no:cacheprovider -p sweep_plugin 2>&1 | tail -2 || true
          echo "### main's tests: where outputs were dropped (the toxicity tests must show up: the control)"
          { sort sweep.log | uniq -c | sort -rn; } 2>/dev/null || echo none
          rm -f sweep.log; cp /tmp/fixed.py tests/detectors/test_detectors_unsafe_content.py
          python -m pytest tests/detectors -q -p no:cacheprovider -p sweep_plugin 2>&1 | tail -2 || true
          echo "### this branch's tests: where outputs were dropped"
          { sort sweep.log | uniq -c | sort -rn; } 2>/dev/null || echo none
